{% extends "learning_logs/base.html" %}
{% block title %}Новая тема · Learning Log{% endblock title %}
{% block content %}
<p class="crumbs"><a href="{% url 'learning_logs:topics' %}">Все темы</a></p>
<h1>Новая тема</h1>
<form class="form" action="{% url 'learning_logs:new_topic' %}" method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="actions">
    <button class="btn" type="submit">Создать тему</button>
    <a class="btn btn-ghost" href="{% url 'learning_logs:topics' %}">Отмена</a>
  </div>
</form>
{% endblock content %}
