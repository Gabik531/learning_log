{% extends "learning_logs/base.html" %}
{% block title %}Регистрация · Learning Log{% endblock title %}
{% block content %}
<h1>Регистрация</h1>
<form class="form" method="post" action="{% url 'users:register' %}">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="actions">
    <button class="btn" type="submit">Зарегистрироваться</button>
    <a class="btn btn-ghost" href="{% url 'users:login' %}">Уже есть аккаунт</a>
  </div>
</form>
{% endblock content %}
